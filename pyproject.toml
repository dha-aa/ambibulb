[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambibulb"
version = "1.0.0"
description = "Drive Wipro/Tuya smart bulbs from your screen color, locally (no cloud at runtime)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mss>=9",
    "pillow>=10",
    "tinytuya>=1.15",
]

[project.optional-dependencies]
follower = []            # the standalone color panel uses only the stdlib (tkinter)
gesture = ["mediapipe>=0.10", "opencv-contrib-python>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
ambibulb = "ambibulb.cli:main"
ambibulb-follow = "ambibulb.follower:main"

[tool.setuptools]
packages = ["ambibulb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
